[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pageindex"
version = "0.1.0"
description = "Optional Python bindings for PageIndex-Rust"
requires-python = ">=3.10"
readme = "../../README.md"
license = { text = "MIT" }

[project.optional-dependencies]
openai = ["openai-agents"]
anthropic = ["anthropic"]
dev = ["pytest"]

[tool.maturin]
python-source = "python"
module-name = "pageindex._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
